<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Family Recipes</title>
<meta name="description" content="A binder of family recipes handed down and collected, with search, filters, and scaling.">

<meta property="og:description" content="A binder of family recipes handed down and collected.">
<meta property="og:type" content="website">

<style>
:root{
  --paper:#EDE9E1; --card:#FCFAF5; --ink:#1B1A17; --ink2:#4A473F; --ink3:#7C776B;
  --pot:#14543F; --pot-soft:#E3EDE7; --brick:#8C2F1E; --brick-soft:#F3E4E0;
  --gold:#C08A21; --rule:#DCD6C8;
  --display:"Fraunces",Georgia,serif; --body:"Public Sans",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
a{color:var(--pot)}
.mast{padding:34px 0 18px}
.mast h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5.4vw,54px);letter-spacing:-.02em;margin:0}
.mast .sub{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;font-size:14px;color:var(--ink3)}
.mast .sub b{color:var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:-1px}
.tab{appearance:none;border:1.5px solid var(--rule);border-bottom:none;background:#E4DFD4;color:var(--ink2);
  font-family:var(--body);font-size:14px;font-weight:600;padding:11px 18px;border-radius:9px 9px 0 0;cursor:pointer}
.tab .n{color:var(--ink3);font-weight:600;margin-left:7px}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:inset 0 3px 0 var(--pot)}
.tab[aria-selected="true"][data-tab="family"]{box-shadow:inset 0 3px 0 var(--brick)}
.tab:focus-visible,.chip:focus-visible,.clear:focus-visible,.scale b:focus-visible{outline:2.5px solid var(--pot);outline-offset:2px}
.panel{background:var(--card);border:1.5px solid var(--rule);border-radius:0 12px 12px 12px;padding:18px 20px}
.searchrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:250px;display:flex;align-items:center;gap:9px;background:#fff;
  border:1.5px solid var(--rule);border-radius:9px;padding:11px 13px;color:var(--ink3)}
.search input{flex:1;border:0;outline:0;font-family:var(--body);font-size:15px;color:var(--ink);background:transparent;min-width:0}
.clear{appearance:none;background:transparent;border:1.5px solid var(--rule);border-radius:9px;
  padding:10px 14px;font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.clear:hover{border-color:var(--pot);color:var(--pot)}
.facets{margin-top:16px;display:grid;gap:12px}
.frow{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.flabel{flex:0 0 132px;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);padding-top:5px}
.fchips{flex:1;display:flex;gap:7px;flex-wrap:wrap;min-width:0}
.hint{font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.02em;text-transform:none}
.chip{appearance:none;font-family:var(--body);font-size:13.5px;font-weight:600;cursor:pointer;
  background:#fff;border:1.5px solid var(--rule);color:var(--ink2);border-radius:999px;padding:6px 13px}
.chip:hover{border-color:var(--pot);color:var(--pot)}
.chip[aria-pressed="true"]{background:var(--pot);border-color:var(--pot);color:#fff}
.facetbar{margin-top:14px;padding-top:13px;border-top:1.5px solid var(--rule);font-size:13.5px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px;margin:22px 0 40px}
.rc{text-align:left;background:var(--card);border:1.5px solid var(--rule);border-top:4px solid var(--pot);
  border-radius:11px;padding:17px 18px;cursor:pointer;font-family:var(--body);display:flex;flex-direction:column;gap:8px}
.rc.fam{border-top-color:var(--brick)}
.rc:hover{border-color:var(--pot);box-shadow:0 3px 14px rgba(20,84,63,.10)}
.rc.fam:hover{border-color:var(--brick)}
.rc h3{font-family:var(--display);font-weight:600;font-size:19.5px;line-height:1.24;margin:0;color:var(--ink)}
.rc .tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pot)}
.rc.fam .tag{color:var(--brick)}
.rc .meta{font-size:13px;color:var(--ink3);margin-top:auto;padding-top:4px}
.rc .hit{font-size:12.5px;background:var(--pot-soft);color:var(--pot);border-radius:7px;padding:6px 9px;line-height:1.35}
.empty{grid-column:1/-1;text-align:center;padding:56px 20px;color:var(--ink3)}
.empty h3{font-family:var(--display);color:var(--ink);margin:0 0 7px}
.hidden{display:none !important}
</style>
</head>
<body><style>
.detail{background:var(--card);border:1.5px solid var(--rule);border-top:5px solid var(--pot);border-radius:12px;margin:22px 0 40px;overflow:hidden}
.detail.fam{border-top-color:var(--brick)}
.dhead{padding:22px 26px 20px}
.back{appearance:none;background:transparent;border:0;color:var(--pot);font-family:var(--body);
  font-size:14px;font-weight:700;cursor:pointer;padding:4px 0;margin-bottom:12px}
.back:hover{text-decoration:underline}
.crumb{font-size:13px;color:var(--ink3);margin-bottom:10px}
.crumb a{color:var(--pot);text-decoration:none;font-weight:600}
.crumb a:hover{text-decoration:underline}
.crumb span{color:var(--ink3);margin:0 7px}
.dhead h2{font-family:var(--display);font-weight:700;font-size:clamp(27px,4vw,40px);line-height:1.12;letter-spacing:-.015em;margin:0 0 8px}
.src{font-size:14px;color:var(--ink3)}
.famtag{font-size:13.5px;font-weight:700;color:var(--brick)}
.dmeta{display:flex;gap:30px;flex-wrap:wrap;margin-top:16px}
.dmeta div span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.dmeta div b{font-weight:400;font-size:14.5px}
.scalebar{display:flex;gap:13px;align-items:center;flex-wrap:wrap;
  background:#EFEBE2;border-top:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule);padding:13px 26px}
.scalebar>span{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.scale{display:flex;border:1.5px solid var(--rule);border-radius:9px;overflow:hidden;background:#fff}
.scale b{font-family:var(--body);font-size:14px;font-weight:600;color:var(--ink2);
  padding:8px 15px;cursor:pointer;border-right:1.5px solid var(--rule)}
.scale b:last-child{border-right:0}
.scale b[aria-pressed="true"]{background:var(--gold);color:#fff}
.yield{font-size:14px;color:var(--ink2)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr)}
.cols>div{padding:24px 26px}
.cols>div:first-child{border-right:1.5px solid var(--rule);background:#FAF7F0}
h4.sec{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:0 0 15px}
.ing{list-style:none;margin:0;padding:0}
.ing li{padding:9px 0;border-bottom:1px solid var(--rule);font-size:15px;line-height:1.45}
.ing li:last-child{border-bottom:0}
.ing b{font-weight:700}
.ing .up{color:var(--gold);font-weight:700}
.ing .old{color:var(--ink3);text-decoration:line-through;font-weight:400;margin-left:5px;font-size:13.5px}
.warn{margin-top:15px;background:#FBF3E2;border-left:3px solid var(--gold);border-radius:0 7px 7px 0;
  padding:11px 13px;font-size:13px;color:var(--ink2);line-height:1.45}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps>li{counter-increment:s;position:relative;padding:0 0 16px 40px;font-size:15px;line-height:1.55}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;
  background:var(--pot);color:#fff;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;font-family:var(--body)}
.notes{margin-top:20px;padding-top:17px;border-top:1.5px solid var(--rule)}
ul.notelist{margin:0;padding:0;list-style:none}
ul.notelist li{position:relative;padding:4px 0 4px 17px;font-size:14px;color:var(--ink2);line-height:1.5}
ul.notelist li::before{content:"";position:absolute;left:2px;top:12px;width:5px;height:5px;
  border-radius:50%;background:var(--ink3)}
.family-notes{border-top:1.5px solid var(--rule);background:#FAF7F0;padding:24px 26px}
.fn-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:15px}
.fn-head h4{margin:0}
.fn-add{appearance:none;background:var(--pot);color:#fff;border:0;border-radius:9px;
  font-family:var(--body);font-size:13.5px;font-weight:700;padding:9px 16px;cursor:pointer}
.fn-add:hover{background:#0F4432}
.fn-list{display:grid;gap:13px}
.fn-item{background:#fff;border:1.5px solid var(--rule);border-radius:10px;padding:14px 16px}
.fn-item .who{font-size:13px;font-weight:700;color:var(--brick)}
.fn-item .when{font-size:12px;color:var(--ink3);margin-left:8px;font-weight:400}
.fn-item p{margin:6px 0 0;font-size:14.5px;line-height:1.5;color:var(--ink2)}
.fn-item img{margin-top:11px;max-width:100%;border-radius:8px;display:block;border:1px solid var(--rule)}
.fn-hero{margin-top:14px;border-radius:10px;overflow:hidden;border:1.5px solid var(--rule)}
.fn-hero img{display:block;width:100%;height:auto}
.fn-none{font-size:14px;color:var(--ink3);line-height:1.55}
.fn-form{background:#fff;border:1.5px solid var(--rule);border-radius:10px;padding:16px;margin-bottom:15px;display:grid;gap:11px}
.fn-form label{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.fn-form input[type=text],.fn-form textarea{width:100%;font-family:var(--body);font-size:15px;color:var(--ink);
  border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;background:#fff}
.fn-form textarea{min-height:88px;resize:vertical}
.fn-form input:focus,.fn-form textarea:focus{outline:2px solid var(--pot);outline-offset:0;border-color:var(--pot)}
.fn-row{display:flex;gap:11px;flex-wrap:wrap;align-items:center}
.fn-note{font-size:12.5px;color:var(--ink3);line-height:1.5}
.fn-status{font-size:13.5px;font-weight:600}
.fn-status.err{color:var(--brick)}
.fn-status.ok{color:var(--pot)}
footer{border-top:1.5px solid var(--rule);padding:22px 0 44px;font-size:12.5px;color:var(--ink3)}
@media(max-width:800px){
  .cols{grid-template-columns:1fr}
  .cols>div:first-child{border-right:0;border-bottom:1.5px solid var(--rule)}
  .flabel{flex:0 0 100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mast-in{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.submit-link{flex:0 0 auto;font-family:var(--body);font-size:14.5px;color:#fff;background:var(--pot);border-radius:8px;padding:11px 20px;text-decoration:none;white-space:nowrap;transition:background .15s}
.submit-link:hover{background:#0F4231}
.submit-link:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.fromline{margin-top:22px;padding-top:18px;border-top:1.5px solid var(--rule)}
.fl-lab{font-size:12px;color:var(--ink3)}
.fl-who{font-family:var(--display);font-weight:600;font-size:19px;color:var(--brick);margin-top:3px;line-height:1.25}
.fromline.fav .fl-who{color:var(--pot)}
.fl-sub{font-size:12.5px;color:var(--ink2);margin-top:3px}
.rc.addtile{border:1.5px dashed var(--brick);border-top:1.5px dashed var(--brick);background:transparent;text-decoration:none;justify-content:center}
.rc.addtile h3{color:var(--brick)}
.rc.addtile .tag{color:var(--brick)}
.rc.addtile .meta{margin-top:6px}
.rc.addtile:hover{border-color:var(--brick);background:var(--brick-soft);box-shadow:none}
</style>
<div class="wrap">
  <header class="mast">
    <div class="mast-in">
      <div>
        <h1>Our Family Recipes</h1>
        <div class="sub"><span><b id="totN">0</b> recipes</span><span><b id="famN">0</b> family</span><span><b id="colN">0</b> collected</span></div>
      </div>
      <a class="submit-link" href="./submit.html">Add a recipe</a>

  <div id="browse">

      <button class="tab" role="tab" data-tab="all" aria-selected="true">All recipes<span class="n" id="tabAllN"></span></button>
      <button class="tab" role="tab" data-tab="family" aria-selected="false">Family<span class="n" id="tabFamN"></span></button>

  <footer>Deep green marks a filter you can press. Brick red always means the family collection. Gold always means a quantity that changed.</footer>

<script>
"use strict";

/* ------------------------------------------------------------------
   FAMILY NOTES + PHOTOS
   Paste your Google Apps Script web app URL between the quotes below
   and the notes form starts saving. Leave it empty and the section
   still shows, explaining that it is not connected yet.
------------------------------------------------------------------ */
var NOTES_ENDPOINT = "https://script.google.com/macros/s/AKfycbzGD34hF-Sdy48nVFM4YS0k5RHuj3mpI7-n4tc0DvaUq3eBhx7lFqRc1oikVW9vzWpG/exec";

var DATA=[], READY=false;
var STATE={tab:"all", q:"", course:"", method:"", main:[], season:[], open:null, scale:1};

var COURSES=["Appetizers & Dips","Breakfast","Breads & Rolls","Main Dishes","Sides","Soups & Stews","Salads","Sauces & Marinades","Cakes & Pies","Cookies & Bars","Candy","Beverages","Frozen Desserts"];
var MAINS=["Beef","Pork","Chicken","Turkey","Seafood","Cheese","Cream Cheese","Vegetarian","Potato","Rice","Pasta","Flour & Yeast","Chocolate","Peanut Butter","Fruit"];
var SEASONS=["Winter","Summer","Fall","Thanksgiving","Christmas","Easter","Rosh Hashanah","St. Patrick's Day","Game Day"];
var METHODS=["Make-ahead","No-bake","Slow cooker","Instant Pot","Bread machine","Gluten-free"];

/* ---------- fractions ---------- */
var FRACS=[[1,8],[1,6],[1,5],[1,4],[1,3],[3,8],[2,5],[1,2],[3,5],[5,8],[2,3],[3,4],[4,5],[5,6],[7,8]];
function parseNum(s){
  s=String(s).trim();
  var m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/); if(m) return (+m[1])+(+m[2])/(+m[3]);
  m=s.match(/^(\d+)\/(\d+)$/); if(m) return (+m[1])/(+m[2]);
  m=s.match(/^\d*\.?\d+$/); if(m) return parseFloat(s);
  return null;
}
function parseQ(q){
  if(q===null||q===undefined) return null;
  var s=String(q).trim().replace(/\u2013|\u2014/g,"-");
  if(s.indexOf("-")>0){
    var p=s.split("-");
    var a=parseNum(p[0]), b=parseNum(p[1]);
    if(a!==null&&b!==null) return {range:true,a:a,b:b};
    return null;
  }
  var n=parseNum(s);
  return n===null?null:{range:false,a:n};
}
function fmtNum(n){
  if(!isFinite(n)) return "";
  var whole=Math.floor(n+1e-9), rest=n-whole, best=null, bd=1;
  if(rest>1e-9){
    for(var i=0;i<FRACS.length;i++){
      var d=Math.abs(rest-FRACS[i][0]/FRACS[i][1]);
      if(d<bd){bd=d;best=FRACS[i];}
    }
    if(bd>0.021){ var r=Math.round(n*100)/100; return String(r); }
    var f=best[0]+"/"+best[1];
    return whole>0?(whole+" "+f):f;
  }
  return String(whole);
}
function fmtQ(p,mult){
  if(!p) return null;
  if(p.range) return fmtNum(p.a*mult)+"\u2013"+fmtNum(p.b*mult);
  return fmtNum(p.a*mult);
}
function el(tag,cls,txt){var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e;}
</script>
<script>
"use strict";

/* ---------- filtering ---------- */
function searchHit(r,q){
  if(!q) return {ok:true,ing:null};
  var t=q.toLowerCase();
  if(r.title.toLowerCase().indexOf(t)>-1) return {ok:true,ing:null};
  for(var i=0;i<r.ingredients.length;i++){
    if(r.ingredients[i].n.toLowerCase().indexOf(t)>-1) return {ok:true,ing:r.ingredients[i].n};
  }
  return {ok:false,ing:null};
}
function matches(r){
  if(STATE.tab!=="all" && r.collection!==STATE.tab) return false;
  if(STATE.course && r.course.indexOf(STATE.course)===-1) return false;
  if(STATE.method && r.method.indexOf(STATE.method)===-1) return false;
  if(STATE.main.length){
    var hitM=false;
    for(var i=0;i<STATE.main.length;i++){ if(r.main.indexOf(STATE.main[i])>-1){ hitM=true; break; } }
    if(!hitM) return false;
  }
  if(STATE.season.length){
    var hitS=false;
    for(var j=0;j<STATE.season.length;j++){ if(r.season.indexOf(STATE.season[j])>-1){ hitS=true; break; } }
    if(!hitS) return false;
  }
  return searchHit(r,STATE.q).ok;
}
function visible(){ return DATA.filter(matches); }

/* ---------- facet rows ---------- */
function facetRow(label,hint,values,isOn,onPick){
  var row=el("div","frow");
  var lab=el("div","flabel"); lab.appendChild(document.createTextNode(label));
  var h=el("div","hint",hint); lab.appendChild(h); row.appendChild(lab);
  var box=el("div","fchips");
  values.forEach(function(v){
    var n=DATA.filter(function(r){
      if(STATE.tab!=="all"&&r.collection!==STATE.tab) return false;
      return (r.course.indexOf(v)>-1||r.main.indexOf(v)>-1||r.season.indexOf(v)>-1||r.method.indexOf(v)>-1);
    }).length;
    if(n===0) return;
    var b=el("button","chip",v);
    b.type="button";
    b.setAttribute("aria-pressed",isOn(v)?"true":"false");
    b.addEventListener("click",function(){ onPick(v); render(); });
    box.appendChild(b);
  });
  row.appendChild(box);
  return row;
}
function renderFacets(){
  var f=document.getElementById("facets");
  f.innerHTML="";
  f.appendChild(facetRow("Course","pick one",COURSES,
    function(v){return STATE.course===v;},
    function(v){ STATE.course = (STATE.course===v?"":v); }));
  f.appendChild(facetRow("Main ingredient","pick any \u2014 any match",MAINS,
    function(v){return STATE.main.indexOf(v)>-1;},
    function(v){ var i=STATE.main.indexOf(v); if(i>-1)STATE.main.splice(i,1); else STATE.main.push(v); }));
  f.appendChild(facetRow("Season & occasion","pick any \u2014 any match",SEASONS,
    function(v){return STATE.season.indexOf(v)>-1;},
    function(v){ var i=STATE.season.indexOf(v); if(i>-1)STATE.season.splice(i,1); else STATE.season.push(v); }));
  f.appendChild(facetRow("Method","pick one",METHODS,
    function(v){return STATE.method===v;},
    function(v){ STATE.method = (STATE.method===v?"":v); }));
}

/* ---------- cards ---------- */
function addTile(){
  var a = el("a","rc addtile");
  a.setAttribute("href","./submit.html");
  a.appendChild(el("div","tag","Add to the binder"));
  a.appendChild(el("h3",null,"Add a family recipe"));
  a.appendChild(el("div","meta","Type it out or photograph the card"));
  return a;
}
function card(r){
  var b=el("button","rc"+(r.collection==="family"?" fam":""));
  b.type="button";
  b.appendChild(el("div","tag",r.collection==="family"?"Family recipe":"Collected"));
  b.appendChild(el("h3",null,r.title));
  var hit=searchHit(r,STATE.q);
  if(hit.ing) b.appendChild(el("div","hit","Contains "+hit.ing));
  var bits=[];
  if(r.course.length) bits.push(r.course[0]);
  if(r.total) bits.push(r.total); else if(r.cook) bits.push(r.cook);
  if(r.yield) bits.push("Makes "+r.yield);
  b.appendChild(el("div","meta",bits.join("  \u00b7  ")));
  b.addEventListener("click",function(){ openRecipe(r.id,true); });
  return b;
}
</script>
<script>
"use strict";

/* ---------- detail ---------- */
function detail(r){
  var d=el("div","detail"+(r.collection==="family"?" fam":""));
  var head=el("div","dhead");

  var crumb=el("div","crumb");
  var a=el("a",null,"All recipes"); a.href="#"; a.addEventListener("click",function(e){e.preventDefault();goBrowse(true);});
  crumb.appendChild(a);
  if(r.course.length){
    crumb.appendChild(el("span",null,"\u203a"));
    var c2=el("a",null,r.course[0]); c2.href="#";
    c2.addEventListener("click",function(e){e.preventDefault(); STATE.course=r.course[0]; goBrowse(true);});
    crumb.appendChild(c2);
  }
  crumb.appendChild(el("span",null,"\u203a"));
  crumb.appendChild(document.createTextNode(r.title));
  head.appendChild(crumb);

  var back=el("button","back","\u2190 All recipes"); back.type="button";
  back.addEventListener("click",function(){ goBrowse(true); });
  head.appendChild(back);

  head.appendChild(el("h2",null,r.title));
  if(r.collection==="family") head.appendChild(el("div","famtag","Family recipe"));
  else if(r.source) head.appendChild(el("div","src",r.source));

  var meta=el("div","dmeta");
  [["Prep",r.prep],["Cook",r.cook],["Total",r.total],["Oven",r.oven]].forEach(function(p){
    if(!p[1]) return;
    var w=el("div"); w.appendChild(el("span",null,p[0])); w.appendChild(el("b",null,p[1])); meta.appendChild(w);
  });
  if(meta.children.length) head.appendChild(meta);
  d.appendChild(head);

  var bar=el("div","scalebar");
  bar.appendChild(el("span",null,"Scale"));
  var sc=el("div","scale");
  [[0.5,"\u00bd\u00d7"],[1,"1\u00d7"],[2,"2\u00d7"],[3,"3\u00d7"],[4,"4\u00d7"]].forEach(function(p){
    var b=el("b",null,p[1]);
    b.tabIndex=0; b.setAttribute("role","button");
    b.setAttribute("aria-pressed",STATE.scale===p[0]?"true":"false");
    b.addEventListener("click",function(){ STATE.scale=p[0]; render(); });
    b.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){e.preventDefault(); STATE.scale=p[0]; render();} });
    sc.appendChild(b);
  });
  bar.appendChild(sc);
  if(r.yield){
    var yt="Makes "+r.yield;
    if(STATE.scale!==1&&r.yieldNum) yt="Makes "+fmtNum(r.yieldNum*STATE.scale)+(r.yieldUnit?" "+r.yieldUnit:"");
    bar.appendChild(el("div","yield",yt));
  }
  d.appendChild(bar);

  var cols=el("div","cols");
  var left=el("div");
  left.appendChild(el("h4","sec","Ingredients"));
  var ul=el("ul","ing");
  var unscaled=0;
  r.ingredients.forEach(function(i){
    var li=el("li");
    var p=parseQ(i.q);
    if(p){
      var nq=fmtQ(p,STATE.scale);
      var b=el("b",STATE.scale!==1?"up":null,nq);
      li.appendChild(b);
      if(STATE.scale!==1) li.appendChild(el("span","old",String(i.q)));
      li.appendChild(document.createTextNode(" "+(i.u?i.u+" ":"")+i.n));
    }else{
      if(i.q) unscaled++;
      li.appendChild(document.createTextNode((i.q?i.q+" ":"")+(i.u?i.u+" ":"")+i.n));
    }
    ul.appendChild(li);
  });
  left.appendChild(ul);
  if(STATE.scale!==1){
    var msgs=["Amounts written into the steps are not scaled \u2014 read them against this list."];
    if(r.isBaked) msgs.push("Baking times and pan sizes do not scale. Use more pans, not a deeper one.");
    if(unscaled) msgs.push(unscaled+" line"+(unscaled>1?"s":"")+" could not be scaled automatically.");
    left.appendChild(el("div","warn",msgs.join(" ")));
  }
  cols.appendChild(left);

  var right=el("div");
  right.appendChild(el("h4","sec","Method"));
  var ol=el("ol","steps");
  r.steps.forEach(function(s){ ol.appendChild(el("li",null,s)); });
  right.appendChild(ol);
  if(r.notes&&r.notes.length){
    var nb=el("div","notes");
    nb.appendChild(el("h4","sec","Notes"));
    var nl=el("ul","notelist");
    r.notes.forEach(function(n){ nl.appendChild(el("li",null,n)); });
    nb.appendChild(nl);
    right.appendChild(nb);
  }
  cols.appendChild(right);
  d.appendChild(cols);

  d.appendChild(fromBlock(r));
  d.appendChild(familyNotes(r));
  return d;
}
</script>
<script>
"use strict";

/* ---------- family notes + photos ---------- */
var NOTE_CACHE={};

function fmtDate(ts){
  var d=new Date(ts);
  if(isNaN(d.getTime())) return String(ts);
  return d.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
}
function resizePhoto(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1600, w=img.width, h=img.height;
      if(w>max||h>max){ if(w>h){h=Math.round(h*max/w); w=max;} else {w=Math.round(w*max/h); h=max;} }
      var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cb(cv.toDataURL("image/jpeg",0.82));
    };
    img.onerror=function(){ cb(null); };
    img.src=fr.result;
  };
  fr.onerror=function(){ cb(null); };
  fr.readAsDataURL(file);
}
function loadNotes(id,cb){
  if(!NOTES_ENDPOINT){ cb([]); return; }
  if(NOTE_CACHE[id]){ cb(NOTE_CACHE[id]); return; }
  fetch(NOTES_ENDPOINT+"?recipe_id="+encodeURIComponent(id))
    .then(function(r){ return r.json(); })
    .then(function(j){ var rows=(j&&j.notes)||[]; NOTE_CACHE[id]=rows; cb(rows); })
    .catch(function(){ cb([]); });
}
function fromBlock(r){
  var f = r.from;
  if(!f) return document.createDocumentFragment();
  var fav = f.kind === "favorite";
  var who = fav ? (f.favoriteOf || "") : (f.called || "");
  if(!who) return document.createDocumentFragment();
  if(!fav && f.lastName && String(who).indexOf(f.lastName) < 0) who = who + " " + f.lastName;
  var box = el("div", "fromline" + (fav ? " fav" : ""));
  box.appendChild(el("div","fl-lab", fav ? "A favorite of" : "From the kitchen of"));
  box.appendChild(el("div","fl-who", who));
  var sub = fav ? (f.why || "") : (f.side || f.relation || "");
  if(sub) box.appendChild(el("div","fl-sub", sub));
  return box;
}
function familyNotes(r){
  var wrap=el("div","family-notes");
  var head=el("div","fn-head");
  head.appendChild(el("h4","sec","Family notes & photos"));
  var addBtn=el("button","fn-add","Add a note or photo"); addBtn.type="button";
  head.appendChild(addBtn);
  wrap.appendChild(head);

  var formHost=el("div"); wrap.appendChild(formHost);
  var list=el("div","fn-list"); wrap.appendChild(list);

  var open=false;
  addBtn.addEventListener("click",function(){
    open=!open;
    formHost.innerHTML="";
    addBtn.textContent = open ? "Cancel" : "Add a note or photo";
    if(open) formHost.appendChild(noteForm(r,list,function(){ open=false; addBtn.textContent="Add a note or photo"; formHost.innerHTML=""; }));
  });

  list.appendChild(el("div","fn-none","Loading notes..."));
  loadNotes(r.id,function(rows){
    list.innerHTML="";
    if(!NOTES_ENDPOINT){
      list.appendChild(el("div","fn-none","Notes and photos are not connected yet. Once the Google Sheet is set up, whatever the family adds here will show up on this recipe, with their name and the date."));
      return;
    }
    if(!rows.length){ list.appendChild(el("div","fn-none","No notes yet. Be the first to add one.")); return; }
    var hero=null;
    for(var i=0;i<rows.length;i++){ if(rows[i].photo_url){ hero=rows[i]; break; } }
    if(hero){
      var hw=el("div","fn-hero"); var him=document.createElement("img");
      him.src=hero.photo_url; him.alt="Photo of "+r.title+" from "+(hero.name||"the family"); him.loading="lazy";
      hw.appendChild(him); wrap.insertBefore(hw,list);
    }
    rows.forEach(function(n){
      var it=el("div","fn-item");
      var who=el("div","who",n.name||"Anonymous");
      who.appendChild(el("span","when",fmtDate(n.timestamp)));
      it.appendChild(who);
      if(n.note) it.appendChild(el("p",null,n.note));
      if(n.photo_url && (!hero||n!==hero)){
        var im=document.createElement("img"); im.src=n.photo_url; im.loading="lazy";
        im.alt="Photo from "+(n.name||"the family"); it.appendChild(im);
      }
      list.appendChild(it);
    });
  });
  return wrap;
}
function noteForm(r,list,done){
  var f=el("div","fn-form");
  var l1=el("label",null,"Your name"); f.appendChild(l1);
  var name=document.createElement("input"); name.type="text"; name.placeholder="Who is this from?"; f.appendChild(name);
  var l2=el("label",null,"Your note or tip"); f.appendChild(l2);
  var note=document.createElement("textarea"); note.placeholder="Mom always doubled the sauce..."; f.appendChild(note);
  var l3=el("label",null,"Photo (optional)"); f.appendChild(l3);
  var row=el("div","fn-row");
  var photo=document.createElement("input"); photo.type="file"; photo.accept="image/*"; row.appendChild(photo);
  f.appendChild(row);
  f.appendChild(el("div","fn-note","Your note is dated automatically. Photos are resized in your browser before sending."));
  var row2=el("div","fn-row");
  var save=el("button","fn-add","Save note"); save.type="button"; row2.appendChild(save);
  var status=el("div","fn-status"); row2.appendChild(status);
  f.appendChild(row2);

  save.addEventListener("click",function(){
    if(!note.value.trim()&&!photo.files.length){ status.className="fn-status err"; status.textContent="Add a note or a photo first."; return; }
    if(!NOTES_ENDPOINT){ status.className="fn-status err"; status.textContent="Not connected to the family sheet yet, so this cannot save."; return; }
    status.className="fn-status"; status.textContent="Saving...";
    save.disabled=true;
    var send=function(photoData){
      fetch(NOTES_ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({recipe_id:r.id,name:name.value.trim(),note:note.value.trim(),photo:photoData||""})})
        .then(function(x){ return x.json(); })
        .then(function(j){
          if(j&&j.ok){ delete NOTE_CACHE[r.id]; status.className="fn-status ok"; status.textContent="Saved. Thank you!"; setTimeout(function(){ done(); render(); },900); }
          else { save.disabled=false; status.className="fn-status err"; status.textContent="That did not save. Try again."; }
        })
        .catch(function(){ save.disabled=false; status.className="fn-status err"; status.textContent="That did not save. Try again."; });
    };
    if(photo.files.length) resizePhoto(photo.files[0],send); else send(null);
  });
  return f;
}
</script>
<script>
"use strict";

/* ---------- history ---------- */
function stateToHash(){
  var p=[];
  if(STATE.open) p.push("r="+encodeURIComponent(STATE.open));
  if(STATE.tab!=="all") p.push("tab="+STATE.tab);
  if(STATE.q) p.push("q="+encodeURIComponent(STATE.q));
  if(STATE.course) p.push("course="+encodeURIComponent(STATE.course));
  if(STATE.method) p.push("method="+encodeURIComponent(STATE.method));
  if(STATE.main.length) p.push("main="+encodeURIComponent(STATE.main.join("|")));
  if(STATE.season.length) p.push("season="+encodeURIComponent(STATE.season.join("|")));
  return p.length?("#"+p.join("&")):"#";
}
function hashToState(){
  var h=location.hash.replace(/^#/,"");
  var o={tab:"all",q:"",course:"",method:"",main:[],season:[],open:null};
  h.split("&").forEach(function(kv){
    if(!kv) return;
    var i=kv.indexOf("="); if(i<0) return;
    var k=kv.slice(0,i), v=decodeURIComponent(kv.slice(i+1));
    if(k==="r") o.open=v;
    else if(k==="tab") o.tab=v;
    else if(k==="q") o.q=v;
    else if(k==="course") o.course=v;
    else if(k==="method") o.method=v;
    else if(k==="main") o.main=v?v.split("|"):[];
    else if(k==="season") o.season=v?v.split("|"):[];
  });
  return o;
}
function applyState(o){
  STATE.tab=o.tab; STATE.q=o.q; STATE.course=o.course; STATE.method=o.method;
  STATE.main=o.main; STATE.season=o.season; STATE.open=o.open;
  var qi=document.getElementById("q"); if(qi&&qi.value!==STATE.q) qi.value=STATE.q;
}
function push(){ history.pushState(null,"",stateToHash()); }
function replace(){ history.replaceState(null,"",stateToHash()); }
function openRecipe(id,pushIt){
  STATE.open=id; STATE.scale=1;
  if(pushIt) push();
  render();
  window.scrollTo({top:0,behavior:"auto"});
}
function goBrowse(pushIt){
  STATE.open=null; STATE.scale=1;
  if(pushIt) push();
  render();
}
window.addEventListener("popstate",function(){ applyState(hashToState()); STATE.scale=1; render(); });

/* ---------- render ---------- */
function render(){
  if(!READY) return;
  var fam=DATA.filter(function(r){return r.collection==="family";}).length;
  document.getElementById("totN").textContent=DATA.length;
  document.getElementById("famN").textContent=fam;
  document.getElementById("colN").textContent=DATA.length-fam;
  document.getElementById("tabAllN").textContent=DATA.length;
  document.getElementById("tabFamN").textContent=fam;
  document.getElementById("tabColN").textContent=DATA.length-fam;

  var browse=document.getElementById("browse"), det=document.getElementById("detail");
  if(STATE.open){
    var r=DATA.filter(function(x){return x.id===STATE.open;})[0];
    if(r){
      browse.classList.add("hidden"); det.classList.remove("hidden");
      det.innerHTML=""; det.appendChild(detail(r));
      document.title=r.title+" \u00b7 Our Family Recipes";
      return;
    }
    STATE.open=null;
  }
  det.classList.add("hidden"); det.innerHTML=""; browse.classList.remove("hidden");
  document.title="Our Family Recipes";

  [].forEach.call(document.querySelectorAll(".tab"),function(t){
    t.setAttribute("aria-selected", t.getAttribute("data-tab")===STATE.tab?"true":"false");
  });
  renderFacets();

  var rows=visible();
  var g=document.getElementById("grid"); g.innerHTML="";
  if(!rows.length){
    var e=el("div","empty");
    e.appendChild(el("h3",null,"Nothing matches yet"));
    e.appendChild(el("p",null,"Try clearing a filter or searching for a single ingredient."));
    g.appendChild(e);
  } else {
    rows.forEach(function(r){ g.appendChild(card(r)); });
    if(STATE.tab !== "collected") g.appendChild(addTile());
  }
  var n=rows.length;
  document.getElementById("countLine").textContent=
    n===DATA.length ? ("Showing all "+n+" recipes") : ("Showing "+n+" of "+DATA.length+" recipes");
}

/* ---------- wiring ---------- */
document.getElementById("q").addEventListener("input",function(e){
  STATE.q=e.target.value; replace(); render();
});
[].forEach.call(document.querySelectorAll(".tab"),function(t){
  t.addEventListener("click",function(){ STATE.tab=t.getAttribute("data-tab"); push(); render(); });
});
document.getElementById("clearAll").addEventListener("click",function(){
  STATE.tab="all"; STATE.q=""; STATE.course=""; STATE.method=""; STATE.main=[]; STATE.season=[];
  document.getElementById("q").value=""; push(); render();
});

/* ---------- boot ---------- */
function boot(data){
  DATA=data; READY=true;
  applyState(hashToState());
  replace();
  render();
}
fetch("./recipes.json")
  .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(boot)
  .catch(function(err){
    console.error("Could not load recipes.json:",err);
    document.getElementById("grid").innerHTML=
      '<div class="empty"><h3>The recipes did not load</h3>'+
      '<p>recipes.json needs to sit next to index.html. If you opened this file straight from your computer, '+
      'browsers block that read \u2014 use the published address instead.</p></div>';
  });
</script>
</body>
